dl_toolbox: "torch"  # The deep learning toolbox. Choices: "torch", "mindspore", "tensorlayer"
logger: "wandb"  # Choices: tensorboard, wandb. swanlab
wandb_user_name: "wmqbit"
render: False
render_mode: 'human' # Choices: 'human', 'rgb_array'.
fps: 50
test_mode: False
device: "cuda:0"  # Choose an calculating device. PyTorch: "cpu", "cuda:0"; TensorFlow: "cpu"/"CPU", "gpu"/"GPU"; MindSpore: "CPU", "GPU", "Ascend", "Davinci".
distributed_training: False  # Whether to use multi-GPU for distributed training.
master_port: '12355'  # The master port for current experiment when use distributed training.


project_name: "walkerdelta_12_122"
log_dir: "./hdrl_sim/logs/walkerdelta_12_12/low/gnnppo/"
model_dir: "./hdrl_sim/models/walkerdelta_12_12/low/gnnppo/"

max_steps : 100
number_episodes : 2000

agent: "GNNPPO_Clip"  # choice: PPO_Clip, PPO_KL
env_name: "walkerdelta"  # The environment name. It should be the same as the one in the envs/__init__.py file.
env_id: "walker"  # The environment ID. It should be the same as the one in the environment class.
env_seed: 1
RGBImgPartialObsWrapper: False
ImgObsWrapper: False
vectorize: "DummyVecEnv"
learner: "gnnppocliplearner" # PPOCLIP_Learner
policy: "Categorical_AC"  # choice: Gaussian_AC for continuous actions, Categorical_AC for discrete actions.
representation: "MultiRound_MPNN_EDGE" # MultiRound_MPNN, Basic_MPNN Basic_GAT, Basic_MPNN_EDGE, MultiRound_MPNN_EDGE
mulitround_mpn_rounds: 3  # The number of message passing rounds in MultiRound_MPNN.

node_feature_dim: 4  # The node feature dimension in the input graph. For walker, it is 5 (x, y, z, vx, vy).
edge_feature_dim: 6  # The edge feature dimension in the input graph. For walker, it is 3 (dx, dy, dz).
node_hidden_feature_dim: 8  # The hidden feature dimension in the input graph. For walker, it is 4 (the distance and the direction cosines).
representation_hidden_size: [256, 128]  # -2: GNN hidden_dim -1: GNN output_dim
actor_hidden_size: [128, 32, 16]
critic_hidden_size: [128, 32, 16]
activation: "leaky_relu"

seed: 1
parallels: 1
running_steps: 1600000
horizon_size: 32  # the horizon size for an environment, buffer_size = horizon_size * parallels.
n_epochs: 1
n_minibatch: 16 # bs = buffer_size // n_minibatch
learning_rate: 0.0002

vf_coef: 0.25
ent_coef: 0.02
target_kl: 0.25  # for PPO_KL agent
kl_coef: 1.0  # for PPO_KL agent
clip_range: 0.2  # for PPO_Clip agent
gamma: 0.99
use_gae: True
gae_lambda: 0.95
use_advnorm: True

use_grad_clip: True  # gradient normalization
clip_type: 1  # Gradient clip for Mindspore: 0: ms.ops.clip_by_value; 1: ms.nn.ClipByNorm()
grad_clip_norm: 0.5
use_actions_mask: False
use_obsnorm: True
use_rewnorm: True
obsnorm_range: 10
rewnorm_range: 100

test_steps: 1000
eval_interval: 25000
test_episode: 100
